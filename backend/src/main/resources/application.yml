spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/equisplit}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


  # data:
  #   redis:
  #     host: localhost
  #     port: 6379

server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

jwt:
  secret: ${JWT_SECRET:equisplit-development-secret-key-change-before-production-123456789}
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:}